[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/native-client",
    "crates/persistence",
    "crates/resources",
    "crates/session",
    "crates/world",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

[workspace.dependencies]
anyhow = "1.0"
bytemuck = { version = "1.25", features = ["derive"] }
flate2 = "1.1"
glam = "0.30"
image = { version = "0.25", default-features = false, features = ["png"] }
pollster = "0.4"
regex = "1.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha1 = "0.10"
sha2 = "0.10"
wgpu = { version = "30.0", default-features = false, features = ["std", "parking_lot", "dx12", "vulkan", "wgsl"] }
winit = { version = "0.30", default-features = false, features = ["rwh_06"] }
zip = { version = "2.4", default-features = false, features = ["deflate"] }

