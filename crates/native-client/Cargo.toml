[package]
name = "native-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
anyhow.workspace = true
bytemuck.workspace = true
glam.workspace = true
image.workspace = true
native-core = { path = "../core" }
native-resources = { path = "../resources" }
native-persistence = { path = "../persistence" }
native-session = { path = "../session" }
native-world = { path = "../world" }
pollster.workspace = true
serde.workspace = true
serde_json.workspace = true
sha1.workspace = true
softbuffer = { version = "0.4.8", default-features = false }
rfd = { version = "0.16.0", default-features = false }
wgpu.workspace = true
winit.workspace = true
zip.workspace = true
lewton = "0.10.2"
cpal = "0.15.3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
flate2.workspace = true
tempfile = "3.27"
